<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Správa závad - Lipovec</title>
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
       emailjs.init("PNZ4TBjtyvsUaK67X");
    </script>

    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #111; color: #fff; font-family: sans-serif; }
        #map { width: 100%; height: 100vh; background: #222; }
        #modal {
            display: none; position: fixed; bottom: 0; left: 0; width: 100%;
            background: #1e1e1e; border-top-left-radius: 16px; border-top-right-radius: 16px;
            padding: 20px 20px 45px 20px; 
            box-shadow: 0 -4px 20px rgba(0,0,0,0.5); z-index: 2000; box-sizing: border-box;
        }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #aaa; }
        .form-group select, .form-group textarea, .form-group input {
            width: 100%; padding: 10px; background: #2a2a2a; border: 1px solid #444; border-radius: 6px; color: #fff; box-sizing: border-box;
        }
        .btn-container { display: flex; gap: 10px; margin-top: 15px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-primary { background: #28a745; color: white; }
        .btn-secondary { background: #444; color: white; }
        #debug-banner {
            position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
            background: rgba(217, 83, 79, 0.9); color: white; padding: 10px 20px;
            border-radius: 8px; z-index: 3000; display: none; font-size: 14px; text-align: center;
        }
    </style>
</head>
<body>

    <div id="debug-banner"></div>
    <div id="map"></div>

    <div id="modal">
        <h3>Nahlásit závadu v obci Lipovec</h3>
        <div class="form-group">
            <label>Kategorie</label>
            <select id="cat">
                <option value="Nesvítící lampa">💡 Nesvítící lampa</option>
                <option value="Výmol v silnici">🕳️ Výmol v silnici</option>
                <option value="Plný koš">🗑️ Plný koš</option>
                <option value="Nefunkční rozhlas">📢 Nefunkční rozhlas</option>
                <option value="Jiné">⚠️ Jiné</option>
            </select>
        </div>
        <div class="form-group">
            <label>Popis</label>
            <textarea id="desc" rows="2" placeholder="Podrobnosti..."></textarea>
        </div>
        <div class="form-group">
            <label>Kdo řeší</label>
            <input type="text" id="assign" placeholder="Např. Obecní úřad">
        </div>
        <div class="btn-container">
            <button class="btn btn-secondary" onclick="document.getElementById('modal').style.display='none'">Zrušit</button>
            <button class="btn btn-primary" onclick="save()">Uložit závadu</button>
        </div>
    </div>

    <script>
        function showError(msg) {
            const b = document.getElementById('debug-banner');
            b.style.display = 'block';
            b.innerHTML = msg;
        }

        const SUPABASE_URL = 'https://zmbtgtibzukjouwpxdlx.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InptYnRndGlienVram91d3B4ZGx4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM2NDQxMjMsImV4cCI6MjEwOTIyMDEyM30.mcx9zWoL3precB9dXufG1YyLoOlX0gvfq103fM3oxv4';
        
        let sb;
        try {
            sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
                auth: { persistSession: false }
            });
        } catch(e) {
            showError('Chyba inicializace Supabase: ' + e.message);
        }

        const LIPOVEC_CENTER = [49.3828, 16.7946];
        const MAX_RADIUS_KM = 3.5; 

        const map = L.map('map').setView(LIPOVEC_CENTER, 15);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let lat = null, lng = null, markers = L.layerGroup().addTo(map);

        function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
            const R = 6371; 
            const dLat = deg2rad(lat2 - lat1);
            const dLon = deg2rad(lon2 - lon1);
            const a =
                Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        function deg2rad(deg) {
            return deg * (Math.PI / 180);
        }

        map.on('click', e => {
            const clickedLat = e.latlng.lat;
            const clickedLng = e.latlng.lng;

            const distance = getDistanceFromLatLonInKm(LIPOVEC_CENTER[0], LIPOVEC_CENTER[1], clickedLat, clickedLng);

            if (distance > MAX_RADIUS_KM) {
                alert('Závady lze hlásit pouze v katastru obce Lipovec!');
                return;
            }

            lat = clickedLat;
            lng = clickedLng;
            document.getElementById('modal').style.display = 'block';
        });

        function getCategoryColor(category) {
            switch (category) {
                case 'Nesvítící lampa': return '#f1c40f';
                case 'Výmol v silnici': return '#e74c3c';
                case 'Plný koš': return '#2ecc71';
                case 'Nefunkční rozhlas': return '#9b59b6';
                default: return '#3498db';
            }
        }

        async function load() {
            try {
                const { data, error } = await sb.from('zavady').select('*');
                if (error) {
                    showError('Chyba Supabase (čtení): ' + error.message);
                    return;
                }
                markers.clearLayers();
                if (data) {
                    data.forEach(i => {
                        const color = getCategoryColor(i.category);
                        const marker = L.circleMarker([i.lat, i.lng], {
                            radius: 9,
                            fillColor: color,
                            color: '#fff',
                            weight: 2,
                            opacity: 1,
                            fillOpacity: 0.9
                        });

                        marker.bindPopup(`
                            <b>${i.category}</b><br>
                            ${i.description || 'Bez popisu'}<br>
                            <small style="color: #aaa;">Řeší: ${i.assigned_to || 'Neuvedeno'}</small><br><br>
                            <button onclick="deleteReport(${i.id})" style="background: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%;">Smazat závadu</button>
                        `);

                        markers.addLayer(marker);
                    });
                }
            } catch(e) {
                showError('Síťová chyba při načítání: ' + e.message);
            }
        }

        async function save() {
            const category = document.getElementById('cat').value;
            const description = document.getElementById('desc').value;
            const assigned_to = document.getElementById('assign').value;

            try {
                const { error } = await sb.from('zavady').insert([{
                    lat: lat, lng: lng,
                    category: category,
                    description: description,
                    assigned_to: assigned_to,
                    status: 'new'
                }]);

                if (error) {
                    alert('Chyba při ukládání: ' + error.message);
                } else {
                    // Odeslání e-mailu přes EmailJS
                    const templateParams = {
                        category: category,
                        description: description || 'Bez popisu',
                        assigned_to: assigned_to || 'Neuvedeno',
                        lat: lat,
                        lng: lng
                    };

                    emailjs.send('service_kd79eme', 'template_dwwgerf', templateParams)
                        .then(response => {
                            console.log('E-mail úspěšně odeslán!', response.status, response.text);
                        }, err => {
                            console.error('Chyba při odesílání e-mailu:', err);
                        });

                    document.getElementById('modal').style.display = 'none';
                    document.getElementById('desc').value = '';
                    document.getElementById('assign').value = '';
                    load();
                    alert('Závada byla úspěšně uložena a e-mailová notifikace odeslána!');
                }
            } catch(e) {
                alert('Výjimka při ukládání: ' + e.message);
            }
        }

        window.deleteReport = async function(id) {
            if (!confirm('Opravdu chcete tuto závadu smazat?')) return;
            try {
                const { error } = await sb.from('zavady').delete().eq('id', id);
                if (error) {
                    alert('Chyba při mazání: ' + error.message);
                } else {
                    load();
                }
            } catch(e) {
                alert('Výjimka při mazání: ' + e.message);
            }
        }

        load();
    </script>
</body>
</html>
